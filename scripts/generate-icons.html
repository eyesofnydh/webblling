<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Generate Webling Icons</title>
  <style>
    body { margin: 20px; font: 14px system-ui; background: #1a1a2e; color: #eee; }
    canvas { border: 1px solid #333; margin: 8px; image-rendering: pixelated; }
    .row { display: flex; align-items: end; gap: 16px; margin: 16px 0; }
    a { color: #5c7cff; }
  </style>
</head>
<body>
  <h1>Webling Icon Generator</h1>
  <p>Right-click each canvas and "Save image as..." to create the PNG icon files.</p>
  <div class="row" id="icons"></div>
  <script>
    const sizes = [16, 32, 48, 128];
    // Pixel art icon design - Webling's head (mask + eyes)
    // Drawn at 16x16 base, scaled up
    function drawWeblingIcon(ctx, size) {
      const s = size / 16;
      ctx.imageSmoothingEnabled = false;
      
      // Helper to draw a pixel rect
      const px = (x, y, w, h, color) => {
        ctx.fillStyle = color;
        ctx.fillRect(x * s, y * s, w * s, h * s);
      };
      
      // Dark outline / body
      px(5, 0, 6, 1, '#0a1024');
      px(4, 1, 1, 1, '#0a1024');
      px(11, 1, 1, 1, '#0a1024');
      px(3, 2, 1, 5, '#0a1024');
      px(12, 2, 1, 5, '#0a1024');
      px(4, 7, 1, 1, '#0a1024');
      px(11, 7, 1, 1, '#0a1024');
      px(5, 8, 6, 1, '#0a1024');
      
      // Red mask fill
      px(5, 1, 6, 1, '#e31d3f');
      px(4, 2, 8, 5, '#e31d3f');
      px(5, 7, 6, 1, '#e31d3f');
      
      // Red highlight
      px(5, 2, 3, 3, '#ff4058');
      
      // Dark mask seam
      px(7, 1, 2, 7, '#97142f');
      
      // Web line above
      px(7, 0, 2, 1, '#e9faff');
      
      // Eyes - dark socket
      px(5, 4, 2, 2, '#0a1024');
      px(9, 4, 2, 2, '#0a1024');
      
      // Eyes - white lens
      px(5, 4, 2, 1, '#f5fbff');
      px(5, 5, 1, 1, '#f5fbff');
      px(9, 4, 2, 1, '#f5fbff');
      px(10, 5, 1, 1, '#f5fbff');
      
      // Body below
      px(4, 9, 8, 1, '#0a1024');
      px(3, 10, 1, 3, '#0a1024');
      px(12, 10, 1, 3, '#0a1024');
      px(4, 13, 8, 1, '#0a1024');
      
      // Torso red
      px(4, 10, 8, 3, '#e31d3f');
      
      // Blue side panels
      px(4, 10, 2, 3, '#16419b');
      px(10, 10, 2, 3, '#16419b');
      
      // Chest mark
      px(7, 10, 2, 2, '#0a1024');
      
      // Legs hint
      px(3, 13, 2, 2, '#16419b');
      px(11, 13, 2, 2, '#16419b');
      px(5, 14, 2, 1, '#e31d3f');
      px(9, 14, 2, 1, '#e31d3f');
      px(4, 15, 1, 1, '#0a1024');
      px(11, 15, 1, 1, '#0a1024');
    }
    
    const container = document.getElementById('icons');
    sizes.forEach(size => {
      const wrapper = document.createElement('div');
      wrapper.style.textAlign = 'center';
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.style.width = `${Math.max(size, 64)}px`;
      canvas.style.height = `${Math.max(size, 64)}px`;
      const ctx = canvas.getContext('2d');
      drawWeblingIcon(ctx, size);
      wrapper.appendChild(canvas);
      const label = document.createElement('div');
      label.textContent = `${size}×${size}`;
      label.style.fontSize = '12px';
      label.style.marginTop = '4px';
      wrapper.appendChild(label);
      
      // Auto download link
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.textContent = `Download icon-${size}.png`;
      link.style.display = 'block';
      link.style.fontSize = '11px';
      link.style.marginTop = '4px';
      wrapper.appendChild(link);
      
      container.appendChild(wrapper);
    });
  </script>
</body>
</html>
