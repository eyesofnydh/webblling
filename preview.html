<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Webling Character Preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7f8fd; background: #0c1020; font: 600 14px system-ui,sans-serif; }
      main { width: min(900px, 92vw); padding: 34px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 28px; color: #aeb7d4; font-weight: 400; }
      .sizes { display: flex; align-items: end; justify-content: center; gap: 38px; min-height: 350px; padding: 28px; border: 1px solid #ffffff18; border-radius: 24px; background-color: #151b31; background-image: linear-gradient(45deg,#ffffff08 25%,transparent 25%),linear-gradient(-45deg,#ffffff08 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff08 75%),linear-gradient(-45deg,transparent 75%,#ffffff08 75%); background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; }
      figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
      .sprite { width: var(--size); height: calc(var(--size) * 1.25); overflow: hidden; }
      img { display: block; width: calc(var(--size) * 8); height: calc(var(--size) * 1.25); max-width: none; }
      figcaption { color: #8993b5; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Webling hero asset</h1>
      <p>Transparent pixel sprite previewed at the four target display widths.</p>
      <section class="sizes">
        <figure style="--size:48px"><div class="sprite"><img src="assets/hero-webling.png" alt="Webling at 48 pixels" /></div><figcaption>48 px</figcaption></figure>
        <figure style="--size:80px"><div class="sprite"><img src="assets/hero-webling.png" alt="Webling at 80 pixels" /></div><figcaption>80 px</figcaption></figure>
        <figure style="--size:120px"><div class="sprite"><img src="assets/hero-webling.png" alt="Webling at 120 pixels" /></div><figcaption>120 px</figcaption></figure>
        <figure style="--size:160px"><div class="sprite"><img src="assets/hero-webling.png" alt="Webling at 160 pixels" /></div><figcaption>160 px</figcaption></figure>
      </section>
    </main>
  </body>
</html>
